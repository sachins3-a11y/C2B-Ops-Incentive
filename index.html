<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub Incentive — Yard Notice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F5F2;--ink:#101828;--ink2:#3D4A63;--rule:#C9CEC6;--pass:#0B7A45;--miss:#B3341F;--gold:#E8A317;--band:#101828}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DDE0DA;font-family:'IBM Plex Sans','IBM Plex Sans Devanagari',sans-serif;color:var(--ink);padding:22px 14px;-webkit-font-smoothing:antialiased}
.bar{max-width:840px;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,button{font-family:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:2px;cursor:pointer}
select{min-width:240px}
button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sheet{max-width:840px;margin:0 auto;background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 2px 0 rgba(16,24,40,.22)}
.hd{background:var(--band);color:#fff;padding:20px 26px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8FA0BE;font-weight:600}
h1{font-family:Archivo,sans-serif;font-weight:900;font-size:30px;line-height:1.04;letter-spacing:-.015em;margin-top:5px}
.lg{font-family:Archivo;font-weight:700;font-size:11px;letter-spacing:.1em;border:1.5px solid #5B6B8C;padding:5px 10px;color:#C6D2E8;white-space:nowrap}
.rule{padding:16px 26px;border-bottom:1.5px solid var(--rule);font-size:19px;font-weight:500;line-height:1.45}
.rule b{font-family:Archivo;font-weight:900;color:var(--ink)}
.sec{padding:18px 26px;border-bottom:1.5px solid var(--rule)}
.sech{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:14px}
.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chk{border:1.5px solid var(--ink);background:#fff;padding:13px 12px 12px;position:relative;min-height:132px;display:flex;flex-direction:column}
.chk .n{font-family:Archivo;font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--ink2)}
.chk .t{font-weight:600;font-size:14.5px;margin:5px 0 9px;line-height:1.25}
.chk .need{font-size:12.5px;color:var(--ink2);margin-bottom:2px}
.chk .got{font-family:Archivo;font-weight:900;font-size:27px;letter-spacing:-.02em;margin-top:auto;line-height:1}
.stamp{position:absolute;top:11px;right:11px;font-family:Archivo;font-weight:900;font-size:11px;letter-spacing:.08em;padding:3px 7px;border:1.5px solid}
.ok .stamp{color:var(--pass);border-color:var(--pass)} .ok .got{color:var(--pass)}
.no .stamp{color:var(--miss);border-color:var(--miss)} .no .got{color:var(--miss)}
.no{background:#FBF3F1}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rung{border:1.5px solid var(--rule);padding:12px;text-align:center;background:#fff}
.rung.on{border-color:var(--ink);border-width:2.5px;background:var(--gold)}
.rung .a{font-family:Archivo;font-weight:900;font-size:23px;line-height:1}
.rung .b{font-size:12.5px;color:var(--ink2);margin-top:5px}
.rung.on .b{color:var(--ink);font-weight:600}
.chain{display:flex;align-items:stretch;flex-wrap:wrap;gap:0;border:1.5px solid var(--ink);background:#fff}
.cell{flex:1 1 0;min-width:104px;padding:14px 10px;text-align:center;border-right:1.5px solid var(--rule)}
.cell:last-child{border-right:0;background:var(--band);color:#fff;flex:1.25 1 0}
.cell .v{font-family:Archivo;font-weight:900;font-size:26px;letter-spacing:-.02em;line-height:1}
.cell:last-child .v{font-size:34px;color:var(--gold)}
.cell .k{font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.3}
.cell:last-child .k{color:#B9C6DE}
.ft{padding:15px 26px;font-size:13px;color:var(--ink2);line-height:1.6}
.ft b{color:var(--ink)}
@media(max-width:700px){.checks,.ladder{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}.rule{font-size:16.5px}}
@media print{body{background:#fff;padding:0}.bar{display:none}.sheet{border:none;box-shadow:none;max-width:100%}}
</style></head><body>

ue": "B", "heads": 1, "units9": 13, "qtr": 130, "recv": 60.0, "disp": 100.0, "dg": 7.7, "dgt": 1, "yms": 38.5, "ymsx": false, "bar": {"recv": 94, "disp": 98, "dg": 5, "yms": 60}, "ch": [false, true, false, false], "passed": 1, "q": 0.0}, {"hub": "Trivandrum Parking", "league": "B", "heads": 1, "units9": 12, "qtr": 120, "recv": 100.0, "disp": 100.0, "dg": 0.0, "dgt": 0, "yms": 16.7, "ymsx": false, "bar": {"recv": 94, "disp": 98, "dg": 5, "yms": 60}, "ch": [true, true, true, false], "passed": 3, "q": 0.75}, {"hub": "Gorakhpur Parking", "league": "B", "heads": 1, "units9": 7, "qtr": 70, "recv": 100.0, "disp": 100.0, "dg": 0.0, "dgt": 0, "yms": 71.4, "ymsx": false, "bar": {"recv": 94, "disp": 98, "dg": 5, "yms": 60}, "ch": [true, true, true, true], "passed": 4, "q": 1.0}, {"hub": "Thrissur Parking", "league": "B", "heads": 1, "units9": 6, "qtr": 60, "recv": 100.0, "disp": 100.0, "dg": 0.0, "dgt": 0, "yms": 0.0, "ymsx": false, "bar": {"recv": 94, "disp": 98, "dg": 5, "yms": 60}, "ch": [true, true, true, false], "passed": 3, "q": 0.75}];
let RATE=15;
const T={
 en:{eyebrow:"Quarterly team incentive · August cycle",lg:"LEAGUE",
  rule:'Every car your hub takes in earns the team <b>₹RATE</b>. Pass all 4 checks and you keep it all.',
  checks:"The 4 checks — measured every month",need:"Need",
  names:["Documents received in 24 hrs","Documents dispatched in 24 hrs","Dealer complaints","Yard app updated"],
  ladder:"Checks passed → what your team keeps",

function draw(){

   <div class="cell"><div class="v">${money(h.qtr*RATE)}</div><div class="k">${t.ck[1].replace('RATE',RATE)}</div></div>
   <div class="cell"><div class="v">${Math.round(h.q*100)}%</div><div class="k">${t.ck[2]}</div></div>
   <div class="cell"><div class="v">${h.heads}</div><div class="k">${t.ck[3].replace('RATE_HEADS',h.heads)}</div></div>
   <div class="cell"><div class="v">${money(per)}</div><div class="k">${t.ck[4]}</div></div>
 </div></div>
 <div class="ft">${t.ft}</div>`;
}
sel.onchange=draw;
// Monthly refresh: replace hubs.json in the repo and Vercel redeploys automatically.
// Falls back to the data baked in above so the file still works opened directly from disk.
fetch('./hubs.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
