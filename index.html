<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub Incentive — Yard Notice</title>
<meta name="description" content="Quarterly team incentive notice for C2B parking hubs — the 4 checks, what your team keeps, and what each person gets.">
<meta name="theme-color" content="#4736FE"><!-- Brand Blue/300 -->
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<link rel="apple-touch-icon" href="./assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Geist = Cars24 brand font. IBM Plex Sans Devanagari covers the Hindi copy, which Geist does not. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   CARS24 LEGO DESIGN SYSTEM
   Layer 1 primitives → Layer 2 semantic → Layer 3 typography → components.
   No hardcoded hex, spacing px, radius px or border px below the token
   blocks. Letter-spacing is 0 everywhere, per the type scale.
   ═══════════════════════════════════════════════════════════════════════ */

/* ─── LAYER 1 — PRIMITIVES (never used directly in components) ───────── */
:root{
  /* Base */
  --base-white:#FFFFFF;

  /* Alpha — White */
  --alpha-white-20:rgba(255,255,255,.20);
  --alpha-white-30:rgba(255,255,255,.30);
  --alpha-white-70:rgba(255,255,255,.70);

  /* Alpha — Black */
  --alpha-black-20:rgba(10,10,10,.04);
  --alpha-black-30:rgba(10,10,10,.11);
  --alpha-black-40:rgba(10,10,10,.18);

  /* Brand Blue (Cars24) */
  --brand-blue-25:#F6F5FF;
  --brand-blue-100:#E3E1FF;
  --brand-blue-300:#4736FE;   /* ✦ primary */
  --brand-blue-400:#4031E5;
  --brand-blue-900:#191359;

  /* Neutral */
  --neutral-50:#FAFAFA;
  --neutral-100:#F5F5F5;
  --neutral-200:#E5E5E5;
  --neutral-300:#D4D4D4;
  --neutral-400:#A1A1A1;
  --neutral-500:#737373;
  --neutral-900:#171717;

  /* Red */
  --red-50:#FEF2F2;
  --red-100:#FFE2E2;
  --red-500:#FB2C36;
  --red-600:#E7000B;
  --red-700:#C10007;

  /* Green */
  --green-50:#F0FDF4;
  --green-100:#DCFCE7;
  --green-500:#00C951;
  --green-600:#00A63E;
  --green-700:#008236;

  /* ─── SPACING ─────────────────────────────────────────────────────── */
  --lego-spacing-2:2px;    --lego-spacing-4:4px;    --lego-spacing-6:6px;
  --lego-spacing-8:8px;    --lego-spacing-10:10px;  --lego-spacing-12:12px;
  --lego-spacing-14:14px;  --lego-spacing-16:16px;  --lego-spacing-18:18px;
  --lego-spacing-20:20px;  --lego-spacing-24:24px;  --lego-spacing-26:26px;
  --lego-spacing-28:28px;  --lego-spacing-30:30px;  --lego-spacing-32:32px;
  --lego-spacing-36:36px;  --lego-spacing-40:40px;  --lego-spacing-44:44px;
  --lego-spacing-48:48px;  --lego-spacing-56:56px;

  /* ─── BORDER ──────────────────────────────────────────────────────── */
  --border-none:0px;
  --border-thin:0.5px;
  --border-regular:1px;
  --border-medium:1.5px;
  --border-bold:2px;

  /* ─── RADIUS ──────────────────────────────────────────────────────── */
  --radius-none:0px;   --radius-xxs:4px;    --radius-xs:8px;
  --radius-s:12px;     --radius-m:14px;     --radius-l:16px;
  --radius-xl:20px;    --radius-xxl:24px;   --radius-xxxl:32px;
  --radius-full:999px;

  /* ─── MOTION (not a Lego layer — kept as tokens so it stays uniform) ─ */
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --dur-1:120ms;
  --dur-2:200ms;
  --dur-3:320ms;
  --dur-4:460ms;
  --stagger:55ms;
}

/* ─── LAYER 2 — SEMANTIC TOKENS + BRAND THEME (Cars24) ───────────────── */
[data-brand="cars24"]{
  /* Brand: Geist, with a Devanagari companion for the Hindi toggle */
  --brand-font:'Geist','IBM Plex Sans Devanagari',sans-serif;
  --brand-primary:var(--brand-blue-300);
  --weight-regular:400;
  --weight-medium:500;
  --weight-semibold:600;
  --weight-bold:700;

  /* surface */
  --lego-color-surface-default-rest:var(--base-white);
  --lego-color-surface-subtle-rest:var(--neutral-50);
  --lego-color-surface-subtle-hover:var(--neutral-100);
  --lego-color-surface-brand-primary-rest:var(--brand-blue-300);
  --lego-color-surface-brand-primary-hover:var(--brand-blue-400);
  --lego-color-surface-brand-subtle-rest:var(--brand-blue-25);
  --lego-color-surface-brand-subtle-active:var(--brand-blue-100);
  --lego-color-surface-feedback-success-rest:var(--green-50);
  --lego-color-surface-feedback-success-subtle:var(--green-100);
  --lego-color-surface-feedback-success-strong:var(--green-600);
  --lego-color-surface-feedback-danger-rest:var(--red-50);
  --lego-color-surface-feedback-danger-subtle:var(--red-100);
  --lego-color-surface-feedback-danger-strong:var(--red-600);
  --lego-color-surface-feedback-neutral-strong:var(--neutral-400);

  /* text */
  --lego-color-text-primary-rest:var(--neutral-900);
  --lego-color-text-secondary-rest:var(--neutral-500);
  --lego-color-text-disabled-rest:var(--neutral-400);
  --lego-color-text-inverse-rest:var(--base-white);
  --lego-color-text-inverse-secondary-rest:var(--alpha-white-70);
  --lego-color-text-brand-primary-rest:var(--brand-blue-300);
  --lego-color-text-brand-strong-rest:var(--brand-blue-900);
  --lego-color-text-feedback-success-rest:var(--green-700);
  --lego-color-text-feedback-danger-rest:var(--red-700);

  /* icon */
  --lego-color-icon-secondary-rest:var(--neutral-500);
  --lego-color-icon-inverse-rest:var(--base-white);
  --lego-color-icon-brand-primary-rest:var(--brand-blue-300);

  /* border */
  --lego-color-border-default-rest:var(--neutral-200);
  --lego-color-border-subtle-rest:var(--neutral-100);
  --lego-color-border-strong-rest:var(--neutral-300);
  --lego-color-border-brand-primary-rest:var(--brand-blue-300);
  --lego-color-border-brand-subtle-rest:var(--brand-blue-100);
  --lego-color-border-inverse-rest:var(--alpha-white-30);
  --lego-color-border-feedback-success-rest:var(--green-500);
  --lego-color-border-feedback-danger-rest:var(--red-500);

  /* translucent */
  --lego-color-translucent-white-20:var(--alpha-white-20);
  --lego-color-translucent-black-20:var(--alpha-black-20);
  --lego-color-translucent-black-30:var(--alpha-black-30);
  --lego-color-translucent-black-40:var(--alpha-black-40);
}

/* ─── LAYER 3 — TYPOGRAPHY (mobile scale) ───────────────────────────── */
.d3{font-size:32px;line-height:38px;letter-spacing:0}
.h1{font-size:24px;line-height:32px;letter-spacing:0}
.h2{font-size:21px;line-height:25px;letter-spacing:0}
.h3{font-size:19px;line-height:23px;letter-spacing:0}
.h4{font-size:17px;line-height:20px;letter-spacing:0}
.h5{font-size:15px;line-height:18px;letter-spacing:0}
.h6{font-size:13px;line-height:16px;letter-spacing:0}
.label-1{font-size:16px;line-height:20px;letter-spacing:0}
.label-2{font-size:14px;line-height:18px;letter-spacing:0}
.label-3{font-size:12px;line-height:16px;letter-spacing:0}
.label-4{font-size:10px;line-height:14px;letter-spacing:0}
.body-1{font-size:15px;line-height:20px;letter-spacing:0}
.body-2{font-size:13px;line-height:18px;letter-spacing:0}
.body-3{font-size:11px;line-height:17px;letter-spacing:0}
.caption-lg{font-size:14px;line-height:16px;letter-spacing:0}
.caption-md{font-size:12px;line-height:14px;letter-spacing:0}
.caption-sm{font-size:9px;line-height:14px;letter-spacing:0}

[data-brand] :is(.d3,.h1,.h2,.h3,.h4,.h5,.h6){font-family:var(--brand-font);font-weight:var(--weight-semibold)}
[data-brand] :is(.label-1,.label-2){font-family:var(--brand-font);font-weight:var(--weight-semibold)}
[data-brand] :is(.label-3,.label-4){font-family:var(--brand-font);font-weight:var(--weight-regular)}
[data-brand] :is(.body-1,.body-2,.body-3){font-family:var(--brand-font);font-weight:var(--weight-regular)}
[data-brand] .caption-lg{font-family:var(--brand-font);font-weight:var(--weight-semibold)}
[data-brand] :is(.caption-md,.caption-sm){font-family:var(--brand-font);font-weight:var(--weight-regular)}

/* Desktop scale */
@media(min-width:1024px){
  .d3{font-size:40px;line-height:48px}
  .h1{font-size:32px;line-height:43px}
  .h2{font-size:28px;line-height:33px}
  .h3{font-size:24px;line-height:29px}
  .h4{font-size:19px;line-height:22px}
  .h5{font-size:17px;line-height:20px}
  .h6{font-size:15px;line-height:18px}
  .label-1{font-size:20px;line-height:25px}
  .label-2{font-size:17px;line-height:22px}
  .label-3{font-size:14px;line-height:19px}
  .label-4{font-size:12px;line-height:17px}
  .body-1{font-size:18px;line-height:24px}
  .body-2{font-size:16px;line-height:22px}
  .body-3{font-size:14px;line-height:22px}
  .caption-lg{font-size:17px;line-height:19px}
  .caption-md{font-size:14px;line-height:16px}
  .caption-sm{font-size:11px;line-height:17px}
}

/* ─── LAYER 4 — COMPONENTS ──────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

body{
  background:var(--lego-color-surface-subtle-rest);
  color:var(--lego-color-text-primary-rest);
  font-family:var(--brand-font);
  font-weight:var(--weight-regular);
  padding:var(--lego-spacing-16);
  -webkit-font-smoothing:antialiased;
}
@media(min-width:1024px){body{padding:var(--lego-spacing-48)}}

.page{
  max-width:940px;
  margin-inline:auto;
  display:flex;
  flex-direction:column;
  gap:var(--lego-spacing-16);
}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.icon{width:var(--lego-spacing-16);height:var(--lego-spacing-16);flex:none}
.icon--sm{width:var(--lego-spacing-14);height:var(--lego-spacing-14)}

/* ═══ PAGE HEADER ═══════════════════════════════════════════════════ */
.topbar{
  position:sticky;
  top:var(--lego-spacing-8);
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--lego-spacing-12);
  flex-wrap:wrap;
  padding:var(--lego-spacing-12) var(--lego-spacing-16);
  background:var(--lego-color-surface-brand-primary-rest);
  color:var(--lego-color-text-inverse-rest);
  border-radius:var(--radius-xl);
  box-shadow:0 var(--lego-spacing-4) var(--lego-spacing-16) var(--lego-color-translucent-black-30);
}
@media(min-width:1024px){
  .topbar{padding:var(--lego-spacing-14) var(--lego-spacing-24);top:var(--lego-spacing-16)}
}
.topbar__brand{display:flex;align-items:center;gap:var(--lego-spacing-12);min-width:0}
.topbar__logo{
  display:block;
  height:var(--lego-spacing-20);
  width:auto;
  aspect-ratio:874/189;   /* logo artwork ratio — geometry, not a spacing token */
  color:var(--lego-color-icon-inverse-rest);
}
.topbar__divider{
  width:var(--border-regular);
  height:var(--lego-spacing-20);
  background:var(--lego-color-border-inverse-rest);
  border-radius:var(--radius-full);
}
.topbar__title{color:var(--lego-color-text-inverse-rest);white-space:nowrap}
.topbar__actions{display:flex;align-items:center;gap:var(--lego-spacing-8)}

/* ═══ BUTTONS ═══════════════════════════════════════════════════════ */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:var(--lego-spacing-8);
  padding:var(--lego-spacing-10) var(--lego-spacing-16);
  border:var(--border-regular) solid transparent;
  border-radius:var(--radius-full);
  font-family:var(--brand-font);
  font-weight:var(--weight-semibold);
  cursor:pointer;
  white-space:nowrap;
  transition:background var(--dur-2) var(--ease-out),
             border-color var(--dur-2) var(--ease-out),
             color var(--dur-2) var(--ease-out),
             transform var(--dur-1) var(--ease-out),
             box-shadow var(--dur-2) var(--ease-out);
}
.btn:active{transform:scale(.96)}

/* on the brand-blue topbar */
.btn--onbrand{
  background:var(--lego-color-translucent-white-20);
  border-color:var(--lego-color-border-inverse-rest);
  color:var(--lego-color-text-inverse-rest);
}
.btn--onbrand:hover{background:var(--alpha-white-30)}
.btn--solid{
  background:var(--lego-color-surface-default-rest);
  color:var(--lego-color-text-brand-primary-rest);
  border-color:transparent;
}
.btn--solid:hover{box-shadow:0 var(--lego-spacing-2) var(--lego-spacing-10) var(--lego-color-translucent-black-40)}

:where(.btn,.dd__trigger,.dd__search input,.sec__toggle,.dd__opt):focus-visible{
  outline:var(--border-bold) solid var(--lego-color-border-brand-primary-rest);
  outline-offset:var(--lego-spacing-2);
}
.topbar :where(.btn):focus-visible{
  outline-color:var(--lego-color-border-inverse-rest);
  outline-width:var(--border-bold);
}

/* ═══ FILTER BAR ════════════════════════════════════════════════════ */
.filters{
  background:var(--lego-color-surface-default-rest);
  border:var(--border-regular) solid var(--lego-color-border-default-rest);
  border-radius:var(--radius-l);
  padding:var(--lego-spacing-16);
  display:flex;
  flex-direction:column;
  gap:var(--lego-spacing-12);
}
.filters__grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:var(--lego-spacing-10);
}
.filters__foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--lego-spacing-12);
  flex-wrap:wrap;
}
.filters__count{color:var(--lego-color-text-secondary-rest)}
.filters__count b{color:var(--lego-color-text-primary-rest);font-weight:var(--weight-semibold)}
.filters__reset{
  background:none;
  border:var(--border-regular) solid transparent;
  border-radius:var(--radius-full);
  padding:var(--lego-spacing-6) var(--lego-spacing-12);
  color:var(--lego-color-text-brand-primary-rest);
  font-family:var(--brand-font);
  font-weight:var(--weight-semibold);
  cursor:pointer;
  transition:background var(--dur-2) var(--ease-out),opacity var(--dur-2) var(--ease-out);
}
.filters__reset:hover{background:var(--lego-color-surface-brand-subtle-rest)}
.filters__reset[hidden]{display:none}

/* ═══ DROPDOWN (searchable combobox — replaces native select) ════════ */
.dd{position:relative;min-width:0}

.dd__trigger{
  width:100%;
  display:flex;
  align-items:center;
  gap:var(--lego-spacing-8);
  text-align:left;
  padding:var(--lego-spacing-8) var(--lego-spacing-12);
  background:var(--lego-color-surface-default-rest);
  border:var(--border-regular) solid var(--lego-color-border-default-rest);
  border-radius:var(--radius-s);
  cursor:pointer;
  font-family:var(--brand-font);
  color:var(--lego-color-text-primary-rest);
  transition:border-color var(--dur-2) var(--ease-out),
             background var(--dur-2) var(--ease-out),
             box-shadow var(--dur-2) var(--ease-out);
}
.dd__trigger:hover{border-color:var(--lego-color-border-strong-rest);background:var(--lego-color-surface-subtle-rest)}
.dd[data-open="true"] .dd__trigger{
  border-color:var(--lego-color-border-brand-primary-rest);
  border-width:var(--border-medium);
  background:var(--lego-color-surface-default-rest);
}
.dd__texts{display:flex;flex-direction:column;gap:var(--lego-spacing-2);min-width:0;flex:1}
.dd__label{color:var(--lego-color-text-secondary-rest)}
[data-brand] .dd__value{
  color:var(--lego-color-text-primary-rest);
  font-weight:var(--weight-semibold);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dd__chevron{
  color:var(--lego-color-icon-secondary-rest);
  transition:transform var(--dur-3) var(--ease-out),color var(--dur-2) var(--ease-out);
}
.dd[data-open="true"] .dd__chevron{transform:rotate(180deg);color:var(--lego-color-icon-brand-primary-rest)}

.dd__panel{
  position:absolute;
  z-index:30;
  top:calc(100% + var(--lego-spacing-6));
  left:0;
  right:auto;
  width:max-content;
  min-width:100%;
  max-width:min(360px,calc(100vw - var(--lego-spacing-32)));
  background:var(--lego-color-surface-default-rest);
  border:var(--border-regular) solid var(--lego-color-border-default-rest);
  border-radius:var(--radius-m);
  box-shadow:0 var(--lego-spacing-10) var(--lego-spacing-32) var(--lego-color-translucent-black-40);
  padding:var(--lego-spacing-8);
  display:flex;
  flex-direction:column;
  gap:var(--lego-spacing-8);
  transform-origin:top center;
  animation:dd-in var(--dur-2) var(--ease-out) both;
}
.dd[data-open="false"] .dd__panel{display:none}
.dd--end .dd__panel{left:auto;right:0}
@keyframes dd-in{
  from{opacity:0;transform:translateY(calc(-1 * var(--lego-spacing-6))) scale(.97)}
  to{opacity:1;transform:none}
}

.dd__search{position:relative;display:flex;align-items:center}
.dd__search .icon{
  position:absolute;
  left:var(--lego-spacing-10);
  color:var(--lego-color-icon-secondary-rest);
  pointer-events:none;
}
.dd__search input{
  width:100%;
  font-family:var(--brand-font);
  font-weight:var(--weight-regular);
  color:var(--lego-color-text-primary-rest);
  background:var(--lego-color-surface-subtle-rest);
  border:var(--border-regular) solid var(--lego-color-border-default-rest);
  border-radius:var(--radius-xs);
  padding:var(--lego-spacing-8) var(--lego-spacing-10) var(--lego-spacing-8) var(--lego-spacing-32);
  transition:border-color var(--dur-2) var(--ease-out),background var(--dur-2) var(--ease-out);
}
.dd__search input:focus{
  outline:none;
  background:var(--lego-color-surface-default-rest);
  border-color:var(--lego-color-border-brand-primary-rest);
  border-width:var(--border-medium);
}
.dd__search input::placeholder{color:var(--lego-color-text-disabled-rest)}

.dd__list{
  list-style:none;
  max-height:var(--dd-list-max);
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:var(--lego-spacing-2);
  scroll-behavior:smooth;
}
.dd{--dd-list-max:264px}   /* ~7 rows before scrolling — a viewport budget, not a token */

.dd__opt{
  display:flex;
  align-items:center;
  gap:var(--lego-spacing-8);
  padding:var(--lego-spacing-8) var(--lego-spacing-10);
  border-radius:var(--radius-xs);
  cursor:pointer;
  color:var(--lego-color-text-primary-rest);
  transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out);
}
.dd__opt:hover{background:var(--lego-color-surface-subtle-hover)}
.dd__opt[data-active="true"]{background:var(--lego-color-surface-brand-subtle-rest)}
.dd__opt[aria-selected="true"]{
  background:var(--lego-color-surface-brand-subtle-rest);
  color:var(--lego-color-text-brand-strong-rest);
}
.dd__opt[aria-selected="true"][data-active="true"]{background:var(--lego-color-surface-brand-subtle-active)}
.dd__opt__text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd__opt__hint{color:var(--lego-color-text-secondary-rest);flex:none}
.dd__opt[aria-selected="true"] .dd__opt__hint{color:var(--lego-color-text-brand-primary-rest)}
.dd__tick{color:var(--lego-color-icon-brand-primary-rest);flex:none;opacity:0;transition:opacity var(--dur-1) var(--ease-out)}
.dd__opt[aria-selected="true"] .dd__tick{opacity:1}
.dd__empty{
  padding:var(--lego-spacing-12) var(--lego-spacing-10);
  color:var(--lego-color-text-secondary-rest);
  text-align:center;
}

/* ═══ SHEET ═════════════════════════════════════════════════════════ */
.sheet{
  background:var(--lego-color-surface-default-rest);
  border:var(--border-regular) solid var(--lego-color-border-default-rest);
  border-radius:var(--radius-xxl);
  overflow:hidden;
  box-shadow:0 var(--lego-spacing-2) var(--lego-spacing-12) var(--lego-color-translucent-black-20);
}

.sheet__hd{
  background:var(--lego-color-surface-brand-primary-rest);
  color:var(--lego-color-text-inverse-rest);
  padding:var(--lego-spacing-24);
  display:flex;
  flex-direction:column;
  gap:var(--lego-spacing-12);
}
@media(min-width:1024px){.sheet__hd{padding:var(--lego-spacing-32)}}
.sheet__brandrow{
  display:flex;
  align-items:center;
  /* only the chip is here on screen (the page header carries the logo), so it
     hugs the sheet's right edge; print puts the logo back and splits them. */
  justify-content:flex-end;
  gap:var(--lego-spacing-16);
  flex-wrap:wrap;
}
/* The page header already carries the logo on screen. The printed sheet has no
   page header, so the mark appears there instead — see @media print. */
.sheet__brandrow .logo{display:none}
.logo{
  height:var(--lego-spacing-20);
  width:auto;
  aspect-ratio:874/189;
  color:var(--lego-color-icon-inverse-rest);
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:var(--lego-spacing-6);
  padding:var(--lego-spacing-6) var(--lego-spacing-12);
  border:var(--border-regular) solid var(--lego-color-border-inverse-rest);
  border-radius:var(--radius-full);
  background:var(--lego-color-translucent-white-20);
  color:var(--lego-color-text-inverse-rest);
  white-space:nowrap;
}
.sheet__eyebrow{color:var(--lego-color-text-inverse-secondary-rest)}
[data-brand] .sheet__title{font-weight:var(--weight-bold);margin-top:var(--lego-spacing-4)}

/* Headline strip */
.headline{
  padding:var(--lego-spacing-20) var(--lego-spacing-24);
  background:var(--lego-color-surface-brand-subtle-rest);
  border-bottom:var(--border-regular) solid var(--lego-color-border-brand-subtle-rest);
  color:var(--lego-color-text-brand-strong-rest);
}
@media(min-width:1024px){.headline{padding:var(--lego-spacing-24) var(--lego-spacing-32)}}
[data-brand] .headline strong{
  font-weight:var(--weight-bold);
  color:var(--lego-color-text-brand-primary-rest);
}

/* ═══ COLLAPSIBLE SECTION ═══════════════════════════════════════════ */
.sec{border-top:var(--border-regular) solid var(--lego-color-border-subtle-rest)}
.headline+.sec{border-top:var(--border-none)}

.sec__toggle{
  width:100%;
  display:flex;
  align-items:center;
  gap:var(--lego-spacing-12);
  padding:var(--lego-spacing-20) var(--lego-spacing-24);
  background:none;
  border:none;
  cursor:pointer;
  text-align:left;
  font-family:var(--brand-font);
  color:var(--lego-color-text-secondary-rest);
  transition:background var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out);
}
@media(min-width:1024px){.sec__toggle{padding:var(--lego-spacing-20) var(--lego-spacing-32)}}
.sec__toggle:hover{background:var(--lego-color-surface-subtle-rest);color:var(--lego-color-text-primary-rest)}
.sec__toggle__text{flex:1;min-width:0}
.sec__summary{
  color:var(--lego-color-text-secondary-rest);
  opacity:0;
  transform:translateX(calc(-1 * var(--lego-spacing-4)));
  transition:opacity var(--dur-3) var(--ease-out),transform var(--dur-3) var(--ease-out);
}
.sec[data-open="false"] .sec__summary{opacity:1;transform:none}
.sec__caret{
  color:var(--lego-color-icon-secondary-rest);
  flex:none;
  transition:transform var(--dur-3) var(--ease-spring),color var(--dur-2) var(--ease-out);
}
.sec[data-open="false"] .sec__caret{transform:rotate(-90deg)}
.sec__toggle:hover .sec__caret{color:var(--lego-color-icon-brand-primary-rest)}

.sec__inner{
  padding:0 var(--lego-spacing-24) var(--lego-spacing-24);
}
@media(min-width:1024px){.sec__inner{padding:0 var(--lego-spacing-32) var(--lego-spacing-32)}}

/* Animate the collapse only where 0fr interpolation is supported, so an
   unsupporting browser simply leaves the section open rather than blank. */
@supports (grid-template-rows: 0fr){
  .sec__body{
    display:grid;
    grid-template-rows:1fr;
    transition:grid-template-rows var(--dur-3) var(--ease-out),opacity var(--dur-2) var(--ease-out);
  }
  .sec__body>*{overflow:hidden;min-height:0}
  .sec[data-open="false"] .sec__body{grid-template-rows:0fr;opacity:0}
}

/* ═══ CHECKS ════════════════════════════════════════════════════════ */
.checks{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:var(--lego-spacing-12)}

.check{
  background:var(--lego-color-surface-subtle-rest);
  border:var(--border-regular) solid var(--lego-color-border-default-rest);
  border-radius:var(--radius-l);
  padding:var(--lego-spacing-16);
  display:flex;
  flex-direction:column;
  gap:var(--lego-spacing-10);
  transition:transform var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out);
}
.check:hover{
  transform:translateY(calc(-1 * var(--lego-spacing-2)));
  box-shadow:0 var(--lego-spacing-8) var(--lego-spacing-20) var(--lego-color-translucent-black-30);
}
.check--pass{
  background:var(--lego-color-surface-feedback-success-rest);
  border-color:var(--lego-color-border-feedback-success-rest);
}
.check--miss{
  background:var(--lego-color-surface-feedback-danger-rest);
  border-color:var(--lego-color-border-feedback-danger-rest);
}
.check__top{display:flex;align-items:center;justify-content:space-between;gap:var(--lego-spacing-8)}
[data-brand] .check__idx{color:var(--lego-color-text-secondary-rest);font-weight:var(--weight-semibold)}
[data-brand] .check__title{color:var(--lego-color-text-primary-rest);font-weight:var(--weight-semibold)}
.check__need{color:var(--lego-color-text-secondary-rest)}
.check__foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--lego-spacing-8)}
[data-brand] .check__got{font-weight:var(--weight-bold)}
.check--pass .check__got{color:var(--lego-color-text-feedback-success-rest)}
.check--miss .check__got{color:var(--lego-color-text-feedback-danger-rest)}

.badge{
  display:inline-flex;
  align-items:center;
  gap:var(--lego-spacing-4);
  padding:var(--lego-spacing-2) var(--lego-spacing-8);
  border:var(--border-regular) solid transparent;
  border-radius:var(--radius-full);
  white-space:nowrap;
}
[data-brand] .badge{font-weight:var(--weight-bold)}
.badge--pass{
  background:var(--lego-color-surface-feedback-success-subtle);
  border-color:var(--lego-color-border-feedback-success-rest);
  color:var(--lego-color-text-feedback-success-rest);
}
.badge--miss{
  background:var(--lego-color-surface-feedback-danger-subtle);
  border-color:var(--lego-color-border-feedback-danger-rest);
  color:var(--lego-color-text-feedback-danger-rest);
}

/* Progress toward the threshold */
.meter{
  height:var(--lego-spacing-6);
  border-radius:var(--radius-full);
  background:var(--lego-color-surface-default-rest);
  border:var(--border-regular) solid var(--lego-color-border-default-rest);
  overflow:hidden;
}
.meter__fill{
  display:block;
  height:100%;
  width:0;
  border-radius:var(--radius-full);
  background:var(--lego-color-surface-feedback-neutral-strong);
  transition:width var(--dur-4) var(--ease-out);
  transition-delay:calc(var(--i,0) * var(--stagger));
}
.check--pass .meter__fill{background:var(--lego-color-surface-feedback-success-strong)}
.check--miss .meter__fill{background:var(--lego-color-surface-feedback-danger-strong)}

/* ═══ LADDER ════════════════════════════════════════════════════════ */
.ladder{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:var(--lego-spacing-12)}

.rung{
  background:var(--lego-color-surface-subtle-rest);
  border:var(--border-regular) solid var(--lego-color-border-default-rest);
  border-radius:var(--radius-l);
  padding:var(--lego-spacing-16) var(--lego-spacing-12);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:var(--lego-spacing-4);
  text-align:center;
  transition:transform var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out);
}
.rung:hover{transform:translateY(calc(-1 * var(--lego-spacing-2)))}
.rung--on{
  background:var(--lego-color-surface-brand-primary-rest);
  border-color:var(--lego-color-surface-brand-primary-rest);
  border-width:var(--border-medium);
  box-shadow:0 var(--lego-spacing-6) var(--lego-spacing-20) var(--lego-color-translucent-black-30);
}
[data-brand] .rung__a{color:var(--lego-color-text-primary-rest);font-weight:var(--weight-bold)}
.rung__b{color:var(--lego-color-text-secondary-rest)}
.rung--on .rung__a{color:var(--lego-color-text-inverse-rest)}
.rung--on .rung__b{color:var(--lego-color-text-inverse-secondary-rest)}

/* ═══ MONEY CHAIN ═══════════════════════════════════════════════════ */
.chain{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:var(--border-regular);
  background:var(--lego-color-border-default-rest);
  border:var(--border-regular) solid var(--lego-color-border-default-rest);
  border-radius:var(--radius-l);
  overflow:hidden;
}
.chain__cell{
  background:var(--lego-color-surface-default-rest);
  padding:var(--lego-spacing-16) var(--lego-spacing-12);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:var(--lego-spacing-4);
  text-align:center;
  transition:background var(--dur-2) var(--ease-out);
}
.chain__cell:hover{background:var(--lego-color-surface-subtle-rest)}
[data-brand] .chain__v{color:var(--lego-color-text-primary-rest);font-weight:var(--weight-bold);font-variant-numeric:tabular-nums}
.chain__k{color:var(--lego-color-text-secondary-rest)}
.chain__cell--total{background:var(--lego-color-surface-brand-primary-rest)}
.chain__cell--total:hover{background:var(--lego-color-surface-brand-primary-hover)}
.chain__cell--total .chain__v{color:var(--lego-color-text-inverse-rest)}
.chain__cell--total .chain__k{color:var(--lego-color-text-inverse-secondary-rest)}

/* ═══ FOOTER + EMPTY STATE ══════════════════════════════════════════ */
.sheet__ft{
  padding:var(--lego-spacing-20) var(--lego-spacing-24);
  background:var(--lego-color-surface-subtle-rest);
  border-top:var(--border-regular) solid var(--lego-color-border-subtle-rest);
  color:var(--lego-color-text-secondary-rest);
}
@media(min-width:1024px){.sheet__ft{padding:var(--lego-spacing-24) var(--lego-spacing-32)}}
[data-brand] .sheet__ft strong{
  color:var(--lego-color-text-primary-rest);
  font-weight:var(--weight-semibold);
}

.empty{
  padding:var(--lego-spacing-56) var(--lego-spacing-24);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:var(--lego-spacing-12);
  text-align:center;
}
.empty__icon{
  width:var(--lego-spacing-48);
  height:var(--lego-spacing-48);
  color:var(--lego-color-icon-secondary-rest);
}
.empty__text{color:var(--lego-color-text-secondary-rest)}

/* ═══ MICROANIMATIONS ═══════════════════════════════════════════════ */
@keyframes rise{
  from{opacity:0;transform:translateY(var(--lego-spacing-12))}
  to{opacity:1;transform:none}
}
@keyframes pop{
  0%{transform:scale(.8);opacity:0}
  60%{transform:scale(1.06)}
  100%{transform:scale(1);opacity:1}
}
/* re-runs on every render because draw() replaces the nodes */
.anim-rise{animation:rise var(--dur-3) var(--ease-out) both;animation-delay:calc(var(--i,0) * var(--stagger))}
.anim-pop{animation:pop var(--dur-3) var(--ease-spring) both;animation-delay:calc(var(--i,0) * var(--stagger) + var(--dur-2))}

/* ─── RESPONSIVE ────────────────────────────────────────────────────── */
@media(max-width:860px){
  .filters__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .checks,.ladder{grid-template-columns:repeat(2,1fr)}
  .chain{grid-template-columns:repeat(2,1fr)}
  .chain__cell--total{grid-column:1/-1}
  .sheet{border-radius:var(--radius-xl)}
  .sheet__hd,.headline,.sec__toggle{padding-left:var(--lego-spacing-16);padding-right:var(--lego-spacing-16)}
  .sec__inner{padding-left:var(--lego-spacing-16);padding-right:var(--lego-spacing-16)}
  .sheet__ft{padding-left:var(--lego-spacing-16);padding-right:var(--lego-spacing-16)}
}
@media(max-width:560px){
  .topbar{padding:var(--lego-spacing-10) var(--lego-spacing-12);border-radius:var(--radius-l)}
  .topbar__title,.topbar__divider{display:none}
  .topbar__actions{flex:1;justify-content:flex-end}
  .filters__grid{grid-template-columns:1fr}
  .checks,.ladder,.chain{grid-template-columns:1fr}
  .dd{--dd-list-max:216px}
}

/* ─── REDUCED MOTION ────────────────────────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:1ms !important;
    animation-delay:0ms !important;
    transition-duration:1ms !important;
    transition-delay:0ms !important;
  }
  .btn:active{transform:none}
  .check:hover,.rung:hover{transform:none}
}

/* ─── PRINT — one A4 sheet per hub ──────────────────────────────────── */
@media print{
  @page{margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *,*::before,*::after{animation:none !important;transition:none !important}
  body{background:var(--lego-color-surface-default-rest);padding:var(--border-none)}
  .topbar,.filters{display:none}
  .page{max-width:none;gap:var(--border-none)}
  .sheet{
    border:var(--border-none);
    border-radius:var(--radius-none);
    box-shadow:none;
  }
  /* the printed sheet has no page header, so it carries the logo itself */
  .sheet__brandrow .logo{display:block}
  .sheet__brandrow{justify-content:space-between}

  /* A collapsed section must still print in full, and the affordances that
     only make sense on screen come off. */
  .sec__body{grid-template-rows:1fr !important;opacity:1 !important}
  .sec__body>*{overflow:visible !important}
  .sec__caret,.sec__summary{display:none}
  .sec__toggle{padding-bottom:var(--lego-spacing-8)}
  .meter__fill{transition:none}

  /* A4 is narrower than the mobile breakpoint, which would otherwise stack
     the grids and push the notice onto a second page. Keep it wide. */
  .checks,.ladder{grid-template-columns:repeat(var(--cols,4),1fr)}
  .chain{grid-template-columns:repeat(5,1fr)}
  .chain__cell--total{grid-column:auto}
  .sheet__hd{padding:var(--lego-spacing-14) var(--lego-spacing-20);gap:var(--lego-spacing-10)}
  .headline{padding:var(--lego-spacing-10) var(--lego-spacing-20)}
  .sec__toggle{padding:var(--lego-spacing-12) var(--lego-spacing-20) var(--lego-spacing-6)}
  .sec__inner{padding:0 var(--lego-spacing-20) var(--lego-spacing-12)}
  .check{padding:var(--lego-spacing-10);gap:var(--lego-spacing-6)}
  .rung{padding:var(--lego-spacing-10) var(--lego-spacing-8)}
  .chain__cell{padding:var(--lego-spacing-10) var(--lego-spacing-8)}
  .sheet__ft{padding:var(--lego-spacing-10) var(--lego-spacing-20)}
  .check:hover,.rung:hover,.chain__cell:hover{transform:none;box-shadow:none;background-color:revert-layer}
}
</style>

  rungs4:["चारों","4 में से 3","4 में से 2","1 या 0"],keeps4:["पूरा पैसा","तीन-चौथाई","आधा","इस बार कुछ नहीं"],
  rungs3:["तीनों","3 में से 2","1 या 0"],keeps3:["पूरा पैसा","दो-तिहाई","इस बार कुछ नहीं"],
  note3:"यार्ड ऐप यहाँ उपलब्ध नहीं",
  chain:"इस तिमाही आपकी टीम का पैसा",
  ck:["गाड़ियाँ","× ₹RATE प्रति गाड़ी","× आपका हिस्सा","÷ RATE_HEADS लोग","हर व्यक्ति को"],
  ft:"तिमाही में एक बार सैलरी के साथ। ऊपर दिए नंबर अगस्त चक्र के हैं। चेक हर महीने नापे जाते हैं और तिमाही का औसत लिया जाता है। सवाल हों तो हब इंचार्ज से पूछें।",
  sChecks:(p,n)=>`${n} में से ${p} पास`,sLadder:p=>`${p}% मिलेगा`,sMoney:m=>`${m} हर व्यक्ति`,
  expand:"सेक्शन खोलें",collapse:"सेक्शन बंद करें"}};

let lang='en';
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');

/* Hub names come from hubs.json, so they are escaped before going into innerHTML. */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const perPerson=h=>Math.min(5000,h.qtr*RATE*h.q/h.heads);

/* ── filter + view state ─────────────────────────────────────────────── */
const DEFAULTS={league:'all',tier:'all',sort:'cars'};
const F={...DEFAULTS};
let selected=0;                                   // index into HUBS
const open={checks:true,ladder:true,money:true};  // survives re-renders

function visibleHubs(){
  let list=HUBS.map((h,i)=>({h,i}));
  if(F.league!=='all') list=list.filter(x=>x.h.league===F.league);
  if(F.tier!=='all')   list=list.filter(x=>String(x.h.q)===F.tier);
  const s=F.sort;
  return list.sort((a,b)=>
    s==='name' ? a.h.hub.localeCompare(b.h.hub) :
    s==='pay'  ? perPerson(b.h)-perPerson(a.h)  :
                 b.h.qtr-a.h.qtr);
}
const leagues=()=>[...new Set(HUBS.map(h=>h.league))].sort();

/* ── dropdown: searchable listbox, replaces the native select ────────── */
function Dropdown(root,cfg){
  const id=root.id;
  root.dataset.open='false';
  root.innerHTML=`
    <button class="dd__trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="${id}-list">
      <span class="dd__texts">
        <span class="dd__label caption-md"></span>
        <span class="dd__value label-2"></span>
      </span>
      <svg class="icon dd__chevron" aria-hidden="true"><use href="#i-chevron"></use></svg>
    </button>
    <div class="dd__panel">
      <div class="dd__search"${cfg.searchable?'':' hidden'}>
        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-search"></use></svg>
        <input type="text" class="body-2" autocomplete="off" spellcheck="false" role="combobox"
               aria-expanded="true" aria-autocomplete="list" aria-controls="${id}-list">
      </div>
      <ul class="dd__list" role="listbox" id="${id}-list"></ul>
      <p class="dd__empty body-2" hidden></p>
    </div>`;

  const trigger=root.querySelector('.dd__trigger');
  const labelEl=root.querySelector('.dd__label');
  const valueEl=root.querySelector('.dd__value');
  const input  =root.querySelector('.dd__search input');
  const list   =root.querySelector('.dd__list');
  const emptyEl=root.querySelector('.dd__empty');

  let isOpen=false, active=0, query='';
  const keyHost=()=>cfg.searchable?input:trigger;

  function matches(){
    const all=cfg.items();
    const q=query.trim().toLowerCase();
    return (!cfg.searchable||!q) ? all : all.filter(o=>o.label.toLowerCase().includes(q));
  }

  function paintList(){
    const items=matches(), val=String(cfg.value());
    if(active>=items.length) active=Math.max(0,items.length-1);
    list.innerHTML=items.map((o,i)=>`
      <li class="dd__opt body-2" role="option" id="${id}-opt-${i}" data-value="${esc(o.value)}"
          aria-selected="${String(o.value)===val}" data-active="${i===active}">
        <span class="dd__opt__text">${esc(o.label)}</span>
        ${o.hint?`<span class="dd__opt__hint caption-md">${esc(o.hint)}</span>`:''}
        <svg class="icon icon--sm dd__tick" aria-hidden="true"><use href="#i-tick"></use></svg>
      </li>`).join('');
    emptyEl.hidden=items.length>0;
    emptyEl.textContent=T[lang].noMatchShort;
    const cur=items[active];
    keyHost().setAttribute('aria-activedescendant',cur?`${id}-opt-${active}`:'');
    if(cur) list.children[active]?.scrollIntoView({block:'nearest'});
  }

  function paintTrigger(){
    labelEl.textContent=cfg.label();
    valueEl.textContent=cfg.valueLabel();
    if(cfg.searchable) input.placeholder=cfg.searchPlaceholder?.()||'';
  }

  function openPanel(){
    if(isOpen) return;
    isOpen=true; root.dataset.open='true';
    trigger.setAttribute('aria-expanded','true');
    query=''; if(cfg.searchable) input.value='';
    const items=matches(), val=String(cfg.value());
    active=Math.max(0,items.findIndex(o=>String(o.value)===val));
    paintList();
    keyHost().focus();
  }
  function closePanel(refocus){
    if(!isOpen) return;
    isOpen=false; root.dataset.open='false';
    trigger.setAttribute('aria-expanded','false');
    keyHost().removeAttribute('aria-activedescendant');
    if(refocus) trigger.focus();
  }
  function setActive(i){
    const items=matches();
    if(!items.length) return;
    active=(i+items.length)%items.length;
    paintList();
  }
  function choose(v){
    closePanel(true);
    cfg.onSelect(v);
  }

  trigger.addEventListener('click',()=>isOpen?closePanel(true):openPanel());

  root.addEventListener('keydown',e=>{
    if(!isOpen){
      if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openPanel();}
      return;
    }
    const items=matches();
    switch(e.key){
      case 'Escape':    e.preventDefault(); closePanel(true); break;
      case 'ArrowDown': e.preventDefault(); setActive(active+1); break;
      case 'ArrowUp':   e.preventDefault(); setActive(active-1); break;
      case 'Home':      e.preventDefault(); setActive(0); break;
      case 'End':       e.preventDefault(); setActive(items.length-1); break;
      case 'Enter':     e.preventDefault(); if(items[active]) choose(items[active].value); break;
      case 'Tab':       closePanel(false); break;
    }
  });

  if(cfg.searchable) input.addEventListener('input',()=>{query=input.value;active=0;paintList();});

  list.addEventListener('click',e=>{
    const li=e.target.closest('.dd__opt');
    if(li) choose(li.dataset.value);
  });
  list.addEventListener('mousemove',e=>{
    const li=e.target.closest('.dd__opt');
    if(!li) return;
    const i=[...list.children].indexOf(li);
    if(i>-1&&i!==active){active=i;[...list.children].forEach((n,j)=>n.dataset.active=String(j===i));
      keyHost().setAttribute('aria-activedescendant',`${id}-opt-${i}`);}
  });

  document.addEventListener('pointerdown',e=>{if(!root.contains(e.target)) closePanel(false);});

  paintTrigger();
  return {refresh(){paintTrigger(); if(isOpen) paintList();}, close(){closePanel(false);}};
}

/* ── the four filters ────────────────────────────────────────────────── */
const ddHub=Dropdown(document.getElementById('ddHub'),{
  searchable:true,
  label:()=>T[lang].fHub,
  searchPlaceholder:()=>T[lang].searchHub,
  items:()=>visibleHubs().map(({h,i})=>({value:i,label:h.hub,hint:T[lang].lg+' '+h.league})),
  value:()=>selected,
  valueLabel:()=>HUBS[selected]?HUBS[selected].hub:'—',
  onSelect:v=>{selected=+v;sync();}
});
const ddLeague=Dropdown(document.getElementById('ddLeague'),{
  label:()=>T[lang].fLeague,
  items:()=>[{value:'all',label:T[lang].all},...leagues().map(l=>({value:l,label:T[lang].leagueOpt(l)}))],
  value:()=>F.league,
  valueLabel:()=>F.league==='all'?T[lang].all:T[lang].leagueOpt(F.league),
  onSelect:v=>{F.league=v;sync();}
});
const ddTier=Dropdown(document.getElementById('ddTier'),{
  label:()=>T[lang].fTier,
  items:()=>[{value:'all',label:T[lang].all},...T[lang].tierOpts.map(([v,l])=>({value:v,label:l}))],
  value:()=>F.tier,
  valueLabel:()=>F.tier==='all'?T[lang].all:(T[lang].tierOpts.find(([v])=>v===F.tier)?.[1]??T[lang].all),
  onSelect:v=>{F.tier=v;sync();}
});
const ddSort=Dropdown(document.getElementById('ddSort'),{
  label:()=>T[lang].fSort,
  items:()=>T[lang].sortOpts.map(([v,l])=>({value:v,label:l})),
  value:()=>F.sort,
  valueLabel:()=>T[lang].sortOpts.find(([v])=>v===F.sort)[1],
  onSelect:v=>{F.sort=v;sync();}
});
const DDS=[ddHub,ddLeague,ddTier,ddSort];

/* ── sheet ───────────────────────────────────────────────────────────── */
const sheetEl=document.getElementById('sheet');
const countEl=document.getElementById('count');
const resetEl=document.getElementById('reset');

/* How close the hub is to each threshold, 0-100. Complaints (index 2) are
   inverted — fewer is better. Only 4-check hubs have a yard-app row at all. */
function meterPct(i,h){
  const got=[h.recv,h.disp,h.dg,h.yms][i];
  const need=[h.bar.recv,h.bar.disp,h.bar.dg,h.bar.yms][i];
  if(got==null||need==null) return 0;
  if(i===2) return got<=need?100:Math.max(6,Math.round(need/got*100));
  return need<=0?100:Math.min(100,Math.round(got/need*100));
}

function section(key,title,summary,body){
  const isOpen=open[key];
  const t=T[lang];
  return `<section class="sec" data-sec="${key}" data-open="${isOpen}">
    <h2>
      <button class="sec__toggle" type="button" aria-expanded="${isOpen}" aria-controls="sec-${key}"
              title="${isOpen?t.collapse:t.expand}">
        <svg class="icon sec__caret" aria-hidden="true"><use href="#i-chevron"></use></svg>
        <span class="sec__toggle__text label-2">${title}</span>
        <span class="sec__summary caption-md">${summary}</span>
      </button>
    </h2>
    <div class="sec__body" id="sec-${key}"><div><div class="sec__inner">${body}</div></div></div>
  </section>`;
}

function draw(){
  const t=T[lang];
  const vis=visibleHubs();

  if(!vis.length){
    sheetEl.innerHTML=`<div class="empty anim-rise">
      <svg class="empty__icon" aria-hidden="true"><use href="#i-empty"></use></svg>
      <p class="h4">${t.noHubs}</p>
      <p class="empty__text body-2">${t.noHubsHint}</p>
    </div>`;
    return;
  }

  const h=HUBS[selected];
  const per=perPerson(h);
  /* Hubs without a yard app are measured on 3 checks, not 4 — n drives the whole
     sheet, including which payout ladder applies (two-thirds, not three-quarters). */
  const n=h.n||4;
  const got=[h.recv==null?'—':h.recv+'%', h.disp==null?'—':h.disp+'%', h.dg+' / 100', h.yms==null?'—':h.yms+'%'].slice(0,n);
  const need=[h.bar.recv+'% +', h.bar.disp+'%', 'max '+h.bar.dg+' / 100', h.bar.yms+'% +'].slice(0,n);
  const rungs=n===4?t.rungs4:t.rungs3, keeps=n===4?t.keeps4:t.keeps3;
  const steps=n===4?[4,3,2,1]:[3,2,1];

  const checksBody=`<div class="checks" style="--cols:${n}">
   ${[...Array(n).keys()].map(i=>`
     <article class="check anim-rise ${h.ch[i]?'check--pass':'check--miss'}" style="--i:${i}">
       <div class="check__top">
         <span class="check__idx label-4">0${i+1}</span>
         <span class="badge anim-pop ${h.ch[i]?'badge--pass':'badge--miss'} caption-sm" style="--i:${i}">
           <svg class="icon icon--sm" aria-hidden="true"><use href="#i-${h.ch[i]?'tick':'cross'}"></use></svg>${h.ch[i]?t.pass:t.miss}
         </span>
       </div>
       <h3 class="check__title h6">${t.names[i]}</h3>
       <div class="check__foot">
         <div class="meter"><span class="meter__fill" data-w="${meterPct(i,h)}" style="--i:${i}"></span></div>
         <p class="check__need caption-md">${t.need}: ${need[i]}</p>
         <p class="check__got h2">${got[i]}</p>
       </div>
     </article>`).join('')}
  </div>`;

  const ladderBody=`<div class="ladder" style="--cols:${steps.length}">
   ${steps.map((v,i)=>{
     const on=h.passed===v||(v===1&&h.passed<=1);
     return `<div class="rung anim-rise ${on?'rung--on':''}" style="--i:${i}"${on?' aria-current="true"':''}>
       <span class="rung__a h4">${rungs[i]}</span>
       <span class="rung__b body-3">${keeps[i]}</span>
     </div>`;}).join('')}
  </div>`;

  const cell=(v,fmt,k,total)=>`<div class="chain__cell ${total?'chain__cell--total':''}">
    <span class="chain__v ${total?'h2':'h4'}" data-count="${v}" data-fmt="${fmt}">${fmt==='money'?money(0):fmt==='pct'?'0%':'0'}</span>
    <span class="chain__k caption-md">${k}</span></div>`;

  const chainBody=`<div class="chain">
    ${cell(h.qtr,'num',t.ck[0])}
    ${cell(h.qtr*RATE,'money',t.ck[1].replace('RATE',RATE))}
    ${cell(h.q*100,'pct',t.ck[2])}
    ${cell(h.heads,'num',t.ck[3].replace('RATE_HEADS',h.heads))}
    ${cell(per,'money',t.ck[4],true)}
  </div>`;

  sheetEl.innerHTML=`
 <header class="sheet__hd">
   <div class="sheet__brandrow">
     ${logoSvg('logo')}
     <span class="chip label-3">${t.lg} ${esc(h.league)} · ${h.heads} ${t.people}</span>
   </div>
   <div>
     <p class="sheet__eyebrow label-3">${t.eyebrow}</p>
     <h1 class="sheet__title h1">${esc(h.hub)}</h1>
   </div>
 </header>

 <p class="headline body-1">${t.rule(n).replace('RATE',RATE)}</p>

 ${section('checks',t.checks(n)+(n===3?' — '+t.note3:''),t.sChecks(h.passed,n),checksBody)}
 ${section('ladder',t.ladder,t.sLadder(Math.round(h.q*100)),ladderBody)}
 ${section('money', t.chain, t.sMoney(money(per)),chainBody)}

 <footer class="sheet__ft body-3">${t.ft}</footer>`;

  animateIn();
}

/* ── micro-interactions ──────────────────────────────────────────────── */
function fmtCount(v,kind){
  return kind==='money' ? money(v)
       : kind==='pct'   ? Math.round(v)+'%'
       :                  Math.round(v).toLocaleString('en-IN');
}
/* Bumped on every render and by settle(), so a count-up left over from an
   earlier draw can never write over newer (or final, pre-print) values. */
let gen=0;
function settle(){                       // jump everything to its final value
  gen++;
  sheetEl.querySelectorAll('[data-count]').forEach(el=>{el.textContent=fmtCount(+el.dataset.count,el.dataset.fmt);});
  sheetEl.querySelectorAll('.meter__fill').forEach(el=>{el.style.width=el.dataset.w+'%';});
}
function animateIn(){
  if(reduceMotion.matches){settle();return;}
  const g=++gen;
  requestAnimationFrame(()=>{
    if(g!==gen) return;
    sheetEl.querySelectorAll('.meter__fill').forEach(el=>{el.style.width=el.dataset.w+'%';});
  });
  sheetEl.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count, kind=el.dataset.fmt, t0=performance.now(), dur=540;
    const step=now=>{
      if(g!==gen) return;
      /* clamp low as well as high: a rAF timestamp can precede t0, which would
         otherwise ease to a negative number and flash "₹-782" on screen. */
      const p=Math.min(1,Math.max(0,(now-t0)/dur)), e=1-Math.pow(1-p,3);
      el.textContent=fmtCount(to*e,kind);
      if(p<1) requestAnimationFrame(step); else el.textContent=fmtCount(to,kind);
    };
    requestAnimationFrame(step);
  });
}

/* collapse/expand — delegated, so it survives every re-render */
sheetEl.addEventListener('click',e=>{
  const btn=e.target.closest('.sec__toggle');
  if(!btn) return;
  const sec=btn.closest('.sec'), key=sec.dataset.sec;
  open[key]=!open[key];
  sec.dataset.open=String(open[key]);
  btn.setAttribute('aria-expanded',String(open[key]));
  btn.title=open[key]?T[lang].collapse:T[lang].expand;
});

/* ── glue ────────────────────────────────────────────────────────────── */
function paintChrome(){
  const t=T[lang], vis=visibleHubs();
  document.getElementById('appTitle').textContent=t.app;
  document.getElementById('printLabel').textContent=t.print;
  document.getElementById('filtersTitle').textContent=t.filters;
  countEl.innerHTML=t.count(vis.length,HUBS.length);
  resetEl.textContent=t.reset;
  resetEl.hidden=F.league===DEFAULTS.league&&F.tier===DEFAULTS.tier&&F.sort===DEFAULTS.sort;
}
function sync(){
  const vis=visibleHubs();
  if(vis.length&&!vis.some(x=>x.i===selected)) selected=vis[0].i;
  DDS.forEach(d=>d.refresh());
  paintChrome();
  draw();
}

document.getElementById('print').onclick=()=>window.print();
resetEl.onclick=()=>{Object.assign(F,DEFAULTS);sync();};
document.getElementById('lang').onclick=e=>{
  lang=lang==='en'?'hi':'en';
  const btn=e.currentTarget;
  btn.setAttribute('aria-pressed',String(lang==='hi'));
  btn.textContent=lang==='en'?'हिन्दी':'English';
  document.documentElement.lang=lang;
  DDS.forEach(d=>d.close());
  sync();
};
addEventListener('beforeprint',settle);

document.getElementById('topbarLogo').innerHTML=logoSvg('topbar__logo');
sync();

// Monthly refresh: replace hubs.json in the repo and Vercel redeploys automatically.
// Falls back to the data baked in above so the file still works opened directly from disk.
fetch('./hubs.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
  if(!d||!Array.isArray(d)||!d.length) return;
  HUBS=d;
  if(selected>=HUBS.length) selected=0;
  sync();
}).catch(()=>{});
</script>
</body>
</html>
